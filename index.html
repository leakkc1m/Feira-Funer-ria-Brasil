    <style>
        /* Your other CSS rules */
        
        /* Change at line 48 */
        body {
            background-color: #003366 !important;
        }
        
        /* Fix para rodapé - remove espaço branco após footer */
        html, body {
            background-color: #003366 !important;
        }

        footer#main-footer {
            background-color: #003366 !important;
            margin-bottom: 0 !important;
            padding-bottom: 30px !important;
        }

        footer#main-footer ~ * {
            background-color: #003366 !important;
            display: none;
        }

        body::after {
            content: '';
            display: block;
            background-color: #003366;
            height: 0;
        }
    </style>
